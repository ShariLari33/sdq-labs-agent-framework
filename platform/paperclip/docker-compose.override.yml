name: sdq-paperclip

services:
  db:
    environment:
      POSTGRES_USER: ${PAPERCLIP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAPERCLIP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PAPERCLIP_POSTGRES_DB}
    ports: !reset []

  server:
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://${PAPERCLIP_POSTGRES_USER}:${PAPERCLIP_POSTGRES_PASSWORD}@db:5432/${PAPERCLIP_POSTGRES_DB}
      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SDQ_API_BASE_URL: ${SDQ_API_BASE_URL}
      SDQ_INTERNAL_API_TOKEN: ${SDQ_INTERNAL_API_TOKEN:-}
